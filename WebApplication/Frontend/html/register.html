<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="register-container">
    <h3 class="text-center mb-3">Register</h3>
    <hr>

    <!-- Alert box for errors -->
    <div class="alert alert-danger d-none" id="errorBox" role="alert">
        <ul id="errorList"></ul>
    </div>

    <div class="row mb-3">
        <label class="col-md-4 col-form-label" for="email">Email</label>
        <div class="col-md-8">
            <input type="email" class="form-control" id="email">
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-md-4 col-form-label" for="password">Password</label>
        <div class="col-md-8">
            <input type="password" class="form-control" id="password">
        </div>
    </div>

    <div class="row mb-3">
        <label class="col-md-4 col-form-label" for="confirmPassword">Confirm Password</label>
        <div class="col-md-8">
            <input type="password" class="form-control" id="confirmPassword">
        </div>
    </div>

    <div class="row">
        <div class="offset-md-4 col d-grid">
            <button class="btn btn-primary" onclick="handleRegister()">Register</button>
        </div>
        <div class="col d-grid">
            <a class="btn btn-outline-primary" href="/" role="button">Cancel</a>
        </div>
    </div>
</div>

<script>
    function handleRegister() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();

        const errorBox = document.getElementById("errorBox");
        const errorList = document.getElementById("errorList");

        errorList.innerHTML = "";
        errorBox.classList.add("d-none");

        const errors = [];

        if (!email) errors.push("Email is Required!");
        if (!password) errors.push("Password is Required!");
        if (!confirmPassword) errors.push("Confirm Password is Required!");
        if (password && confirmPassword && password !== confirmPassword) {
            errors.push("Password and ConfirmPassword do not match!");
        }

        if (errors.length > 0) {
            errors.forEach(err => {
                const li = document.createElement("li");
                li.textContent = err;
                errorList.appendChild(li);
            });
            errorBox.classList.remove("d-none");
            return;
        }

        // Fake register logic
        alert("Registration successful!");
        window.location.href = "/";
    }
</script>

</body>
</html>
