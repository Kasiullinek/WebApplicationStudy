<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h3 class="text-center mb-3">Login</h3>
        <hr>

        <!-- Alert box for errors -->
        <div class="alert alert-danger d-none" id="errorBox" role="alert">
            <ul id="errorList"></ul>
        </div>

        <div class="mb-3">
            <label class="form-label" for="emailInput">Email</label>
            <input type="email" class="form-control" id="emailInput">
        </div>

        <div class="mb-3">
            <label class="form-label" for="passwordInput">Password</label>
            <input type="password" class="form-control" id="passwordInput">
        </div>

        <div class="row">
            <div class="col d-grid">
                <button class="btn btn-primary" onclick="handleLogin()">Log in</button>
            </div>
            <div class="col d-grid">
                <a class="btn btn-outline-primary" href="/" role="button">Cancel</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorBox = document.getElementById('errorBox');
            const errorList = document.getElementById('errorList');

            errorList.innerHTML = '';
            errorBox.classList.add('d-none');

            const errors = [];

            if (!email) {
                errors.push("Email is Required!");
            }

            if (!password) {
                errors.push("Password is Required!");
            }

            if (errors.length > 0) {
                errors.forEach(err => {
                    const li = document.createElement('li');
                    li.textContent = err;
                    errorList.appendChild(li);
                });
                errorBox.classList.remove('d-none');
                return;
            }

            // Fake backend login simulation
            // Replace this with real backend call (e.g., fetch or XMLHttpRequest)
            if (email === "admin@example.com" && password === "password") {
                alert("Login successful!");
                window.location.href = "/";
            } else {
                errorList.innerHTML = '<li>Invalid login credentials</li>';
                errorBox.classList.remove('d-none');
            }
        }
    </script>

</body>
</html>
